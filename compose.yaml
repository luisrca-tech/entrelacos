services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: entrelacos
      POSTGRES_PASSWORD: local
      POSTGRES_DB: entrelacos_dev
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, entrelacos, -d, entrelacos_dev]
      interval: 2s
      timeout: 5s
      retries: 15

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_USER: entrelacos
      POSTGRES_PASSWORD: local
      POSTGRES_DB: entrelacos_test
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, entrelacos, -d, entrelacos_test]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
