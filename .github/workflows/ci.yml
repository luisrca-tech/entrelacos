name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check:workspaces
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
        env:
          # CI validates static artifacts without publishing or contacting a site.
          PUBLIC_SITE_URL: https://entrelacos.example.test/
          PUBLIC_BOTANICAL_DEMO_URL: https://botanico.example.test/
          PUBLIC_LETTERS_DEMO_URL: https://cartas.example.test/
      - run: bun run check:public-builds
      - run: git diff --check

  database-integration:
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: entrelacos
          POSTGRES_PASSWORD: local
          POSTGRES_DB: entrelacos_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U entrelacos -d entrelacos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://entrelacos:local@127.0.0.1:55432/entrelacos_dev
      DATABASE_URL_TEST: postgresql://entrelacos:local@127.0.0.1:55433/entrelacos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:db
